services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kumurska
      POSTGRES_PASSWORD: kumurska
      POSTGRES_DB: kumurska
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumurska"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
